name: node20
version: "20.18.1"
description: "Node.js 20 LTS with npm + npmmirror auto-config"

platforms:
  windows:
    url: "https://nodejs.org/dist/v20.18.1/node-v20.18.1-win-x64.zip"
    sha256: "56e5aacdeee7168871721b75819ccacf2367de8761b78eaceacdecd41e04ca03"
    install_type: "zip_extract"
    install_path: "node20"
    path_add: ["{{install_dir}}"]

post_install:
  config_files:
    - path: ".npmrc"
      template: "registry={{mirror_npm}}\n"

tags:
  - "runtime"
  - "javascript"

maintainer:
  name: "BG4JTS"
  github: "BG4JTS"
