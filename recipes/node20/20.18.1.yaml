name: node20
version: "20.18.1"
description: "Node.js 20 LTS with npm + npmmirror auto-config"

platforms:
  windows:
    url: "https://nodejs.org/dist/v20.18.1/node-v20.18.1-win-x64.zip"
    sha256: "56e5aacdeee7168871721b75819ccacf2367de8761b78eaceacdecd41e04ca03"
    install_type: "zip_extract"
    install_path: "node20"
    path_add: ["{{install_dir}}/node-v20.18.1-win-x64"]
  linux:
    url: "https://nodejs.org/dist/v20.18.1/node-v20.18.1-linux-x64.tar.gz"
    sha256: "259e5a8bf2e15ecece65bd2a47153262eda71c0b2c9700d5e703ce4951572784"
    install_type: "tar_extract"
    install_path: "node20"
    path_add: ["{{install_dir}}/node-v20.18.1-linux-x64"]
  darwin:
    url: "https://nodejs.org/dist/v20.18.1/node-v20.18.1-darwin-x64.tar.gz"
    sha256: "c5497dd17c8875b53712edaf99052f961013cedc203964583fc0cfc0aaf93581"
    install_type: "tar_extract"
    install_path: "node20"
    path_add: ["{{install_dir}}/node-v20.18.1-darwin-x64"]

post_install:
  config_files:
    - path: "{{user_home}}/.npmrc"
      template: "registry={{mirror_npm}}\n"

tags:
  - "runtime"
  - "javascript"
  - "typescript"

maintainer:
  name: "BG4JTS"
  github: "BG4JTS"
