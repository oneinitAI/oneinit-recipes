name: rg
version: "14.1.0"
description: "ripgrep — recursively searches directories for a regex pattern"
license: "Unlicense OR MIT"
license_url: "https://github.com/BurntSushi/ripgrep/blob/master/COPYING"
dynamic:
  repo: BurntSushi/ripgrep
  asset_pattern: "ripgrep-{version}-{os}-{arch}.{ext}"
  checksum: "asset.sha256"
  bin_subdir: ""
# platforms 为 fallback（指定精确版本且动态解析失败时回退），版本由 dynamic 实时解析
platforms:
  windows:
    url: "https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/ripgrep-14.1.0-x86_64-pc-windows-msvc.zip"
    sha256: "fe4f75edfaa50f0d4fecbf47696b7629f3449c9c2c5a4da828753139e5a2e203"
    install_type: "zip_extract"
    install_path: "rg"
    path_add: ["{{install_dir}}/ripgrep-14.1.0-x86_64-pc-windows-msvc"]
  linux:
    url: "https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/ripgrep-14.1.0-x86_64-unknown-linux-musl.tar.gz"
    sha256: "f84757b07f425fe5cf11d87df6644691c644a5cd2348a2c670894272999d3ba7"
    install_type: "tar_extract"
    install_path: "rg"
    path_add: ["{{install_dir}}/ripgrep-14.1.0-x86_64-unknown-linux-musl"]
  darwin:
    url: "https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/ripgrep-14.1.0-x86_64-apple-darwin.tar.gz"
    sha256: "4d882fc945e5a9b6080a5c0506f7fe4aaea191c1865355428dd4bfa096f974b5"
    install_type: "tar_extract"
    install_path: "rg"
    path_add: ["{{install_dir}}/ripgrep-14.1.0-x86_64-apple-darwin"]
tags:
  - "cli"
  - "search"
maintainer:
  name: "BG4JTS"
  github: "BG4JTS"
verified: false
