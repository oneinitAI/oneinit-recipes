name: rust
version: "stable"
description: "Rust toolchain via rustup with rsproxy.cn cargo mirror"

platforms:
  windows:
    url: "https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe"
    sha256: "86478e53f769379d7f0ebfa7c9aa97cb76ca92233f79aa2cc0dbee2efaac73c7"
    install_type: "exe_silent"
    install_args: ["-y", "--default-toolchain", "stable", "--profile", "minimal"]
    install_path: "rust"
    path_add: ["{{user_home}}/.cargo/bin"]
  linux:
    url: "https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init"
    sha256: "4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10"
    install_type: "binary_copy"
    install_path: "rust"
    path_add: ["{{user_home}}/.cargo/bin"]
  darwin:
    url: "https://static.rust-lang.org/rustup/dist/x86_64-apple-darwin/rustup-init"
    sha256: "33cf85df9142bc6d29cbc62fa5ca1d4c29622cddb55213a4c1a43c457fb9b2d7"
    install_type: "binary_copy"
    install_path: "rust"
    path_add: ["{{user_home}}/.cargo/bin"]

post_install:
  config_files:
    - path: "{{user_home}}/.cargo/config.toml"
      template: |
        [source.crates-io]
        replace-with = "rsproxy-sparse"

        [source.rsproxy-sparse]
        registry = "sparse+https://rsproxy.cn/index/"

        [registries.rsproxy]
        index = "https://rsproxy.cn/crates.io-index"

        [net]
        git-fetch-with-cli = true
  commands:
    - "{{install_dir}}/rustup-init -y --default-toolchain stable --profile minimal"

tags:
  - "runtime"
  - "rust"

maintainer:
  name: "BG4JTS"
  github: "BG4JTS"
