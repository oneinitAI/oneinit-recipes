name: Validate Recipes

# 触发：PR + push main；仅当配方/索引/校验脚本变更时执行（避免文档/CI PR 空跑）
on:
  pull_request:
    paths:
      - "recipes/**"
      - "INDEX.json"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "recipes/**"
      - "INDEX.json"
      - "scripts/**"

# 作者豁免：BG4JTS（作者/维护者）与 oneinitAI（组织/机器人账号）的提交跳过检查，
# 加速单人维护；社区贡献者的 PR 全量检查。
permissions:
  contents: read

jobs:
  validate:
    name: Validate registry
    if: github.actor != 'BG4JTS' && github.actor != 'oneinitAI'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run validation
        run: python scripts/validate.py

  # Keep INDEX.json sorted/stable — reject messy PRs
  consistency:
    name: INDEX.json consistency
    if: github.actor != 'BG4JTS' && github.actor != 'oneinitAI'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify INDEX.json parses & packages are sorted
        run: |
          python - <<'EOF'
          import json, sys
          with open("INDEX.json", encoding="utf-8") as f:
              data = json.load(f)
          names = list(data.get("packages", {}).keys())
          if names != sorted(names):
              print(f"ERROR: packages must be alphabetically sorted: {names}")
              sys.exit(1)
          print(f"OK: {len(names)} packages, sorted")
          EOF

  # ============================================================
  # 安装计划验证：下载最新 oneinit 二进制，对每个配方跑 install --dry-run
  # （不实际下载/安装，仅验证配方可解析、计划可生成）
  # ============================================================
  dryrun:
    name: Install dry-run (${{ matrix.os }})
    if: github.actor != 'BG4JTS' && github.actor != 'oneinitAI'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup oneinit
        id: setup
        uses: ./.github/actions/setup-oneinit
        with:
          version: latest

      - name: Dry-run install every recipe
        shell: bash
        run: |
          BIN="${{ steps.setup.outputs.bin-path }}"
          export ONEINIT_HOME="$(pwd)/.oneinit-ci"
          mkdir -p "$ONEINIT_HOME/recipes" "$ONEINIT_HOME/cache"
          cp recipes/*/*.yaml "$ONEINIT_HOME/recipes/"
          echo '{"version":1,"last_updated":"2026-01-01T00:00:00Z","packages":{}}' > "$ONEINIT_HOME/cache/INDEX.json"
          echo "{\"registry_url\":\"http://127.0.0.1:1/\",\"subscriptions\":[],\"last_update\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > "$ONEINIT_HOME/registry.json"
          for recipe in recipes/*/*.yaml; do
            name=$(basename "$(dirname "$recipe")")
            echo "== dry-run: $name =="
            "$BIN" install "$name" --dry-run || { echo "::error::install dry-run failed for $name"; exit 1; }
          done
