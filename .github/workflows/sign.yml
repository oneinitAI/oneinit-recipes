name: Sign INDEX

on:
  push:
    branches: [main]
    paths:
      - "INDEX.json"

permissions:
  contents: write

jobs:
  sign:
    name: Sign INDEX.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sign with Ed25519 key
        env:
          ONEINIT_SIGN_KEY: ${{ secrets.ONEINIT_SIGN_KEY }}
        run: node scripts/sign.js

      - name: Commit signature
        run: |
          git config user.name "oneinit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add INDEX.json.sig
          if git diff --cached --quiet; then
            echo "signature unchanged"
          else
            git commit -m "ci: sign INDEX.json"
            git push
          fi
