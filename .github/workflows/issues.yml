name: Issue Auto-Label & Guide

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label-and-guide:
    name: Auto-label + guide
    runs-on: ubuntu-latest
    steps:
      - name: Auto-label & guide
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { issue } = context.payload;
            const text = `${issue.title}\n${issue.body || ""}`.toLowerCase();
            const labels = [];

            // 按内容自动分类
            if (/recipe|配方|package|包/.test(text)) labels.push("recipe");
            if (/bug|错误|失败|broken|fail|checksum|sha/.test(text)) labels.push("bug");
            if (/\?|how|question|help|咨询/.test(text)) labels.push("question");

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels,
              });
            }

            // 引导评论：根据标签给出下一步
            const isRecipe = labels.includes("recipe") || /recipe|配方/.test(issue.title.toLowerCase());
            let guide = "";
            if (isRecipe) {
              guide = [
                "📦 **配方请求已收到！** 这里有个快速通道：",
                "",
                "1. **直接提 PR**（推荐，有 CI 自动校验）：",
                "   1. 写配方 `recipes/<name>/<version>.yaml`",
                "   2. 更新 `INDEX.json`（保持字母序）",
                "   3. 本地验证：`python scripts/validate.py`",
                "   4. 提 PR → CI 自动检查格式与一致性",
                "",
                "2. 或者补充以下信息方便维护者代劳：",
                "   - 官方下载地址（各平台）",
                "   - 校验和（SHA256/SHA512，**请勿猜测**）",
                "   - 镜像源建议（pip→清华 / npm→淘宝 / cargo→rsproxy / maven→阿里云）",
              ].join("\n");
            } else if (labels.includes("bug")) {
              guide = [
                "🐛 **Bug 反馈已收到！** 请确认包含：",
                "",
                "- 配方名 + 版本",
                "- 操作系统",
                "- `oneinit install <name>` 的完整输出（可用 `--json`）",
                "",
                "缺少信息时维护者会回复补充要求。",
              ].join("\n");
            }

            if (guide) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `<!-- oneinit-bot -->\n${guide}`,
              });
            }
