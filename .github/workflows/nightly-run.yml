name: Nightly Install Verify

on:
  schedule:
    # UTC 20:00 = 北京时间 04:00（消费主仓库 19:30 的 nightly 构建）
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  install-verified:
    name: Install verified recipes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup oneinit (nightly)
        id: setup
        uses: ./.github/actions/setup-oneinit
        with:
          version: nightly

      - name: Install all verified recipes
        shell: bash
        run: |
          BIN="${{ steps.setup.outputs.bin-path }}"
          export ONEINIT_HOME="$(pwd)/.oneinit-nightly"
          mkdir -p "$ONEINIT_HOME/recipes" "$ONEINIT_HOME/cache"
          cp recipes/*/*.yaml "$ONEINIT_HOME/recipes/"
          echo '{"version":1,"last_updated":"2026-01-01T00:00:00Z","packages":{}}' > "$ONEINIT_HOME/cache/INDEX.json"
          echo "{\"registry_url\":\"http://127.0.0.1:1/\",\"subscriptions\":[],\"last_update\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > "$ONEINIT_HOME/registry.json"
          verified=0
          for recipe in recipes/*/*.yaml; do
            # 宽松匹配 verified: true（容忍空格差异）
            if grep -qE "verified:\s*true" "$recipe"; then
              name=$(basename "$(dirname "$recipe")")
              echo "== install (verified): $name =="
              "$BIN" -y install "$name" || { echo "::error::real install failed for $name"; exit 1; }
              verified=$((verified+1))
            fi
          done
          echo "installed ${verified} verified recipe(s)"

  alert:
    name: Open issue on failure
    needs: install-verified
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Create issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = `[nightly] ${today} install verify failed`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", per_page: 100,
            });
            if (existing.data.some((i) => i.title === title)) {
              console.log(`issue already exists, skip`); return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              body: `Nightly install verify (${context.workflow}) failed on ${today}.\n\nSee run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["ci"],
            });

