name: 🐛 Recipe Bug
description: 某个配方安装失败 / 校验和错误 / 路径不对
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: 配方名
      placeholder: node20
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: "20.18.1"
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 错误信息
      description: 粘贴 oneinit install 的完整输出
      render: shell
    validations:
      required: true
